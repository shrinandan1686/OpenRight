name: openright
description: Smart link shortener for YouTube videos

publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP requests
  http: ^1.2.0
  
  # URL launcher for deep links
  url_launcher: ^6.2.5
  
  # Share functionality
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1c1b1f" # Matching the logo background
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#1c1b1f" # Matching dark background
  image: "assets/splash.png"
  android_12:
    image: "assets/icon.png"
    color: "#1c1b1f"

flutter:
  uses-material-design: true
